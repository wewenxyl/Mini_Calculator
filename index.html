<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="brand">

            <h1>Mini Calculator</h1>

            <p>Let's Calculate Something!</p>

        </div>


        <div class="calculator">

            <div class="display">
                <div id="previous"></div>
                <div id="current">0</div>
            </div>


            <div class="buttons">

                <button class="function" onclick="clearDisplay()">
                    AC
                </button>

                <button class="function" onclick="deleteNumber()">
                    DEL
                </button>

                <button class="function" onclick="chooseOperator('%')">
                    %
                </button>

                <button class="operator" onclick="chooseOperator('/')">
                    ÷
                </button>


                <button onclick="appendNumber('7')">
                    7
                </button>

                <button onclick="appendNumber('8')">
                    8
                </button>

                <button onclick="appendNumber('9')">
                    9
                </button>

                <button class="operator" onclick="chooseOperator('*')">
                    ×
                </button>


                <button onclick="appendNumber('4')">
                    4
                </button>

                <button onclick="appendNumber('5')">
                    5
                </button>

                <button onclick="appendNumber('6')">
                    6
                </button>

                <button class="operator" onclick="chooseOperator('-')">
                    −
                </button>


                <button onclick="appendNumber('1')">
                    1
                </button>

                <button onclick="appendNumber('2')">
                    2
                </button>

                <button onclick="appendNumber('3')">
                    3
                </button>

                <button class="operator" onclick="chooseOperator('+')">
                    +
                </button>


                <button class="zero" onclick="appendNumber('0')">
                    0
                </button>

                <button onclick="appendNumber('.')">
                    .
                </button>

                <button class="equals" onclick="calculate()">
                    =
                </button>

            </div>

        </div>


        <p class="footer">
            Calculate. Create. Learn.
        </p>

    </div>


    <script src="script.js"></script>

</body>
                    </html>
